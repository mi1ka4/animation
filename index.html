<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мольберт — трансляция</title>
<style>
:root{--pbg:rgba(255,255,255,.93);--pfg:#1a1a1a;--pbd:#bbb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pbg:rgba(32,32,32,.93);--pfg:#eee;--pbd:#555}}
:root[data-theme="dark"]{--pbg:rgba(32,32,32,.93);--pfg:#eee;--pbd:#555}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif}
#cam{position:fixed;inset:0;width:100%;height:100%;background:#000}
.hud{position:fixed;z-index:2;pointer-events:none;color:#fff;font:600 clamp(13px,2vw,26px) "Courier New",monospace;text-shadow:0 0 4px #000}
#rec{left:4%;top:5%}#tc{right:4%;top:5%}#cm{left:4%;bottom:5%;opacity:.8}
.dot{display:inline-block;width:.75em;height:.75em;border-radius:50%;background:#e22;margin-right:.5em;animation:bl 1.2s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.scan{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(rgba(0,0,0,.13) 0 1px,transparent 1px 3px)}
#blk{position:fixed;inset:0;z-index:5;background:#000;display:none}
#panel{position:fixed;z-index:10;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px;border-radius:10px;background:var(--pbg);border:1px solid var(--pbd)}
#panel button{font:14px system-ui,sans-serif;padding:8px 10px;border-radius:8px;border:1px solid var(--pbd);background:transparent;color:var(--pfg);cursor:pointer}
#panel button b{font-weight:600;margin-right:6px}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style></head><body>
<canvas id="cam"></canvas>
<div class="scan"></div>
<div class="hud" id="rec"><span class="dot"></span>REC</div>
<div class="hud" id="tc">00:00:00:00</div>
<div class="hud" id="cm">CAM 2 LIVE</div>
<div id="blk"></div>
<div id="panel"></div>
<script>
const $=s=>document.querySelector(s),cv=$('#cam'),ctx=cv.getContext('2d');
const LAT=.25,DT=5.5,HAIR='#2b1d16';
const PAL=[['#e8742a','#ffd08a'],['#2f7fc8','#a9d6ff'],['#8a4fc0','#e0c4ff'],['#e2ae22','#fff0a0'],['#cc3a6c','#ffb3cc']];
const POS=[[.3,.36,1.1,-.2],[.7,.3,.8,.25],[.5,.64,1.3,.05],[.2,.74,.7,-.35],[.8,.72,.95,.3]];
const SP=[[52,-32,9],[62,32,6],[30,-10,5]],VN=[[80,-45],[88,-28],[72,-4],[78,26],[56,52],[34,50]];
function bez(a,b,c,d,n){const o=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;o.push([u*u*u*a[0]+3*u*u*t*b[0]+3*u*t*t*c[0]+t*t*t*d[0],u*u*u*a[1]+3*u*u*t*b[1]+3*u*t*t*c[1]+t*t*t*d[1]])}return o}
const R=[].concat(bez([0,-6],[25,-60],[80,-65],[88,-30],22),bez([88,-30],[92,-8],[55,-2],[8,4],14).slice(1),bez([8,4],[50,8],[82,26],[60,56],16).slice(1),bez([60,56],[46,70],[20,55],[0,16],16).slice(1));
const OUT=R.concat(R.slice().reverse().map(p=>[-p[0],p[1]]));
let W,H,dpr=1,P,bf=[],next=0,hairs=[],drops=[],smears=[],hand=null,sneezeT=-9,focusT=-9,T=0,frame=0,black=false,timers=[];
const brush={a:0,x:0,y:0,c:'#000'};
const K=()=>Math.min(P.w,P.h)/430,rnd=Math.random;
function fit(){dpr=Math.min(devicePixelRatio||1,1.5);W=cv.width=innerWidth*dpr|0;H=cv.height=innerHeight*dpr|0;const pw=W*.7,ph=H*.8;P={x:(W-pw)/2,y:H*.1,w:pw,h:ph}}
function reset(){timers.forEach(clearTimeout);timers=[];bf=POS.map((p,i)=>({i,x:p[0],y:p[1],s:p[2],r:p[3],c:PAL[i],o:0,f:0,dr:false,fly:null}));next=0;hairs=[];drops=[];smears=[];hand=null;sneezeT=-9;focusT=-9;setBlack(false)}
function setBlack(v){black=v;$('#blk').style.display=v?'block':'none'}
const later=f=>setTimeout(f,LAT*1000);
function spawnHair(){for(let i=0;i<3;i++){const L=(80+rnd()*60)*dpr,ph=rnd()*6,pts=[];for(let j=0;j<=14;j++){const t=j/14;pts.push([t*L,Math.sin(t*6+ph)*L*.09])}
hairs.push({x:P.x+P.w*(.25+rnd()*.5),y0:P.y-120*dpr,y1:P.y+P.h*(.15+rnd()*.7),a0:rnd()*6,a1:rnd()*6.28,t:-(.15+i*.12+rnd()*.1),d:1.2+rnd()*.6,pts})}}
function spawnDrop(){drops.push({x:P.x+P.w*(.2+rnd()*.6),y:P.y+P.h*(.25+rnd()*.5),c:PAL[Math.floor(rnd()*5)][0],r:(18+rnd()*18)*dpr,n:Array.from({length:16},()=>.75+rnd()*.45),t:0})}
const A={
draw(){if(next<bf.length){bf[next].dr=true;next++}},
sneeze(){later(()=>{sneezeT=T;spawnHair()})},
hand(){later(()=>{hand={t:0,dur:1.15,dy:(rnd()-.5)*H*.2,sm:false}})},
drop(){later(spawnDrop)},
focus(){later(()=>{focusT=T})},
fly(){bf.forEach((b,i)=>{if(b.o<=0||b.fly)return;b.o=1;b.f=1;b.dr=false;b.fly={p:[P.x+b.x*P.w,P.y+b.y*P.h],t:-i*.35-rnd()*.3,ph:rnd()*6,vx:((b.x-.5)*420+(rnd()-.5)*160)*dpr,vy:-(110+rnd()*120)*dpr,z:1}})},
black(){setBlack(!black)},
reset,
auto(){reset();[[300,'draw'],[7500,'sneeze'],[9500,'draw'],[16500,'hand'],[19000,'draw'],[26000,'drop'],[28000,'draw'],[35000,'focus'],[37000,'draw'],[44500,'sneeze'],[48500,'fly'],[58000,'black']].forEach(([ms,n])=>timers.push(setTimeout(A[n],ms)))},
full(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();$('#panel').style.display='none'},
panel(){const p=$('#panel');p.style.display=p.style.display==='none'?'flex':'none'}};
const KEYS=[['Space','draw','Рисовать бабочку','␣'],['KeyS','sneeze','Чих','S'],['KeyH','hand','Взмах руки','H'],['KeyD','drop','Капля','D'],['KeyF','focus','Расфокус','F'],['KeyL','fly','Оживить и выпустить','L'],['KeyK','black','Чёрный экран','K'],['KeyA','auto','Автопрогон','A'],['KeyR','reset','Сброс','R'],['Enter','full','Полный экран','↵'],['KeyT','panel','Скрыть панель','T']];
const panel=$('#panel');panel.onmousedown=e=>e.preventDefault();
KEYS.forEach(k=>{const b=document.createElement('button');b.innerHTML='<b>'+k[3]+'</b>'+k[2];b.onclick=()=>A[k[1]]();panel.appendChild(b)});
addEventListener('keydown',e=>{if(e.repeat)return;const k=KEYS.find(k=>k[0]===e.code);if(k){e.preventDefault();A[k[1]]()}});
addEventListener('resize',fit);

const nc=document.createElement('canvas');nc.width=160;nc.height=90;const nx=nc.getContext('2d'),nd=nx.createImageData(160,90);
function tipOf(b){const p=OUT[Math.min(OUT.length-1,Math.floor(b.o*(OUT.length-1)))],sc=K()*b.s,c=Math.cos(b.r),s=Math.sin(b.r);return[P.x+b.x*P.w+sc*(p[0]*c-p[1]*s),P.y+b.y*P.h+sc*(p[0]*s+p[1]*c)]}
function update(dt){let on=false;
for(const b of bf){
if(b.dr){on=true;if(b.o<1){b.o=Math.min(1,b.o+dt/DT);const t=tipOf(b);brush.x=t[0];brush.y=t[1];brush.c=b.c[0]}else{b.f=Math.min(1,b.f+dt/1.6);if(b.f>=1)b.dr=false}}
if(b.fly){const f=b.fly;f.t+=dt;f.ph+=dt*(f.t<0?9:24);if(f.t>0){f.vx+=Math.sin(f.t*2.3+b.i)*90*dpr*dt;f.vy-=70*dpr*dt;f.p[0]+=f.vx*dt;f.p[1]+=f.vy*dt;f.z+=dt*.35}}}
brush.a+=((on?1:0)-brush.a)*Math.min(1,dt*4);
hairs.forEach(h=>h.t+=dt);drops.forEach(d=>d.t+=dt);
if(hand){hand.t+=dt;if(!hand.sm&&hand.t>hand.dur*.55){hand.sm=true;smears.push({x:P.x+P.w*(.35+rnd()*.4),y:P.y+P.h*(.3+rnd()*.4),c:PAL[Math.max(0,next-1)][0]})}if(hand.t>hand.dur)hand=null}}
function line(a,b,c,d){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke()}
function blob(x,y,r,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(20,12,8,'+a+')');g.addColorStop(1,'rgba(20,12,8,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r)}
function drawBf(b,t){if(b.o<=0)return;const fl=b.fly,n=Math.floor(b.o*(OUT.length-1));ctx.save();
const p=fl?fl.p:[P.x+b.x*P.w,P.y+b.y*P.h],sc=K()*b.s*(fl?fl.z:1);
ctx.translate(p[0],p[1]);ctx.rotate(b.r+(fl&&fl.t>0?Math.sin(t*3+b.i)*.25:0));ctx.scale(sc,sc);
ctx.save();ctx.scale(fl?.2+.8*Math.abs(Math.cos(fl.ph)):1,1);
if(b.f>0){ctx.globalAlpha=b.f;const g=ctx.createRadialGradient(0,10,4,0,10,95);g.addColorStop(0,b.c[1]);g.addColorStop(1,b.c[0]);
ctx.beginPath();OUT.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fillStyle=g;ctx.fill();
ctx.fillStyle='rgba(255,255,255,.55)';SP.forEach(s=>[1,-1].forEach(m=>{ctx.beginPath();ctx.arc(m*s[0],s[1],s[2],0,7);ctx.fill()}));
ctx.strokeStyle='rgba(40,20,10,.35)';ctx.lineWidth=1.2;ctx.beginPath();VN.forEach(v=>[1,-1].forEach(m=>{ctx.moveTo(0,4);ctx.lineTo(m*v[0],v[1])}));ctx.stroke();ctx.globalAlpha=1}
ctx.strokeStyle='#2a1a14';ctx.lineWidth=3*dpr/sc;ctx.lineJoin=ctx.lineCap='round';
ctx.beginPath();for(let i=0;i<=n;i++)i?ctx.lineTo(OUT[i][0],OUT[i][1]):ctx.moveTo(OUT[0][0],OUT[0][1]);ctx.stroke();ctx.restore();
if(b.o>=1){ctx.fillStyle=ctx.strokeStyle='#2a1a14';ctx.beginPath();ctx.ellipse(0,6,4.5,24,0,0,7);ctx.fill();ctx.beginPath();ctx.arc(0,-20,5,0,7);ctx.fill();
ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-22);ctx.quadraticCurveTo(-6,-45,-20,-52);ctx.moveTo(0,-22);ctx.quadraticCurveTo(6,-45,20,-52);ctx.stroke()}
ctx.restore()}
function drawBrush(t){if(brush.a<.02)return;const u=dpr,j=(T-sneezeT<.5)?(rnd()-.5)*30*u:0,x=brush.x+Math.sin(t*25)*1.2*u+j,y=brush.y+Math.cos(t*21)*1.2*u+j*.5,dx=.55,dy=.83;
ctx.save();ctx.globalAlpha=brush.a;ctx.lineCap='round';
ctx.strokeStyle='rgba(0,0,0,.2)';ctx.lineWidth=14*u;line(x+16*u+dx*40*u,y+22*u+dy*40*u,x+16*u+dx*520*u,y+22*u+dy*520*u);
ctx.strokeStyle='#7a4a24';ctx.lineWidth=12*u;line(x+dx*60*u,y+dy*60*u,x+dx*540*u,y+dy*540*u);
ctx.strokeStyle='#b9b9b9';ctx.lineWidth=11*u;line(x+dx*30*u,y+dy*30*u,x+dx*62*u,y+dy*62*u);
ctx.strokeStyle=brush.c;ctx.lineWidth=8*u;line(x,y,x+dx*30*u,y+dy*30*u);ctx.restore()}
function drawHand(){if(!hand)return;const p=hand.t/hand.dur,e=p*p*(3-2*p),sx=W*1.2,sy=H,ex=-W*.15,ey=H*.2+hand.dy,L=Math.hypot(ex-sx,ey-sy),dx=(ex-sx)/L,dy=(ey-sy)/L,
x=sx+(ex-sx)*e,y=sy+(ey-sy)*e-Math.sin(e*Math.PI)*H*.12;
for(let k=0;k<12;k++)blob(x-dx*k*70*dpr,y-dy*k*70*dpr,(70+k*3)*dpr,.2);
blob(x+dx*10*dpr,y+dy*10*dpr,70*dpr,.3);
for(let i=-2;i<=2;i++)blob(x+dx*85*dpr-dy*i*34*dpr,y+dy*85*dpr+dx*i*34*dpr,26*dpr,.26);
ctx.fillStyle='rgba(0,0,0,'+.12*Math.sin(Math.PI*p)+')';ctx.fillRect(-300,-300,W+600,H+600)}
function render(){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);
const st=T-sneezeT,a=st<.8?Math.exp(-st*6):0,ox=(Math.sin(T*.7)*3+Math.sin(st*47)*16*a)*dpr,oy=(Math.cos(T*.9)*2+Math.sin(st*31+1)*28*a)*dpr,z=1.012+.05*a+.004*Math.sin(T*.5);
ctx.save();ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-W/2+ox,-H/2+oy);
ctx.fillStyle='#14100c';ctx.fillRect(-300,-300,W+600,H+600);
const m=16*dpr;ctx.fillStyle='#5a3d26';ctx.fillRect(P.x-m,P.y-m,P.w+2*m,P.h+2*m);
const g=ctx.createRadialGradient(P.x+P.w*.4,P.y+P.h*.3,P.h*.1,P.x+P.w*.5,P.y+P.h*.5,P.w*.7);g.addColorStop(0,'#f8f3ea');g.addColorStop(1,'#ddd5c4');ctx.fillStyle=g;ctx.fillRect(P.x,P.y,P.w,P.h);
ctx.lineCap='round';smears.forEach(s=>{ctx.globalAlpha=.14;ctx.strokeStyle=s.c;ctx.lineWidth=26*dpr;line(s.x,s.y,s.x-P.w*.22,s.y-P.h*.08)});ctx.globalAlpha=1;
drops.forEach(d=>{const t=d.t,f=.5,y0=P.y-30*dpr;ctx.fillStyle=d.c;
if(t<f){const q=t/f,y=y0+(d.y-y0)*q*q,u=dpr;ctx.beginPath();ctx.arc(d.x,y,7*u,0,7);ctx.moveTo(d.x-6*u,y-3*u);ctx.lineTo(d.x,y-26*u);ctx.lineTo(d.x+6*u,y-3*u);ctx.fill()}
else{const q=Math.min(1,(t-f)/.6),e=1-Math.pow(1-q,3),r=d.r*e;ctx.globalAlpha=.88;ctx.beginPath();d.n.forEach((k,i)=>{const an=i/16*6.283;ctx.lineTo(d.x+Math.cos(an)*r*k,d.y+Math.sin(an)*r*k*.9)});ctx.fill();
const q2=Math.min(1,Math.max(0,(t-f-.3)/1.2));ctx.strokeStyle=d.c;ctx.lineWidth=5*dpr;line(d.x+d.r*.2,d.y,d.x+d.r*.2,d.y+70*dpr*(1-Math.pow(1-q2,2)));
ctx.globalAlpha=.35;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(d.x-r*.3,d.y-r*.3,r*.18,0,7);ctx.fill();ctx.globalAlpha=1}});
bf.forEach(b=>{if(!b.fly)drawBf(b,T)});
hairs.forEach(h=>{if(h.t<0)return;const q=Math.min(1,h.t/h.d),e=q*q*(3-2*q);ctx.save();
ctx.translate(h.x+Math.sin(q*6+h.a0)*20*dpr*(1-q),h.y0+(h.y1-h.y0)*e);ctx.rotate(h.a0+(h.a1-h.a0)*e);
ctx.strokeStyle=HAIR;ctx.lineWidth=1.6*dpr;ctx.beginPath();h.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.restore()});
drawBrush(T);drawHand();bf.forEach(b=>{if(b.fly)drawBf(b,T)});
ctx.restore();
const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.hypot(W,H)*.55);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.65)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
if(frame%2===0){const d=nd.data;for(let i=0;i<d.length;i+=4){d[i]=d[i+1]=d[i+2]=rnd()*255;d[i+3]=255}nx.putImageData(nd,0,0)}
ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.16;ctx.imageSmoothingEnabled=false;ctx.drawImage(nc,0,0,W,H);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
ctx.fillStyle='rgba(0,0,0,'+(.03+.025*Math.sin(T*13))+')';ctx.fillRect(0,0,W,H);
const ft=T-focusT,bl=ft<1.4?9*Math.sin(Math.PI*ft/1.4):0;cv.style.filter=bl>.3?'blur('+bl.toFixed(1)+'px)':'none'}
const tcEl=$('#tc');let last=performance.now();
function loop(ms){requestAnimationFrame(loop);const dt=Math.min(.05,(ms-last)/1000);last=ms;T+=dt;frame++;update(dt);render();
const f=Math.floor(T*25)%25,s=Math.floor(T)%60,mi=Math.floor(T/60)%60,h=Math.floor(T/3600);tcEl.textContent=[h,mi,s,f].map(n=>String(n).padStart(2,'0')).join(':')}
fit();reset();requestAnimationFrame(loop);
</script></body></html>
